<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nabil & Nour — Engagement</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    
    :root {
      --gold:       #c9a84c;
      --gold-light: #e8d5a3;
      --gold-dim:   #7a6030;
      --rose:       #c4607a;
      --rose-light: #f0b8c8;
      --cream:      #fdf6ee;
      --dark:       #0d0a08;
      --dark2:      #1a1410;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--dark);
      color: var(--cream);
      overflow: hidden;
    }

    body.scrollable { overflow-y: auto; overflow-x: hidden; }

    /* ── PARTICLES ── */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: drift linear infinite;
      opacity: 0;
    }

    @keyframes drift {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* ── OVERLAY ── */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
      background: var(--dark);
    }

    #overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(201,168,76,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .ornament-top {
      font-size: 28px;
      color: var(--gold);
      letter-spacing: 12px;
      opacity: 0.6;
      margin-bottom: 30px;
      animation: fadeSlideDown 1.2s ease forwards;
    }

    .overlay-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(52px, 10vw, 90px);
      color: var(--gold);
      line-height: 1;
      text-align: center;
      animation: fadeSlideDown 1.4s ease forwards;
      text-shadow: 0 0 60px rgba(201,168,76,0.3);
    }

    .overlay-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold-light);
      opacity: 0.7;
      margin-top: 14px;
      animation: fadeSlideDown 1.6s ease forwards;
    }

    .divider-line {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 28px auto;
      animation: fadeSlideDown 1.7s ease forwards;
    }

    #enterBtn {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 14px 42px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      animation: fadeSlideDown 1.9s ease forwards;
      z-index: 1;
    }

    #enterBtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-101%);
      transition: transform 0.4s ease;
      z-index: -1;
    }

    #enterBtn:hover { color: var(--dark); }
    #enterBtn:hover::before { transform: translateX(0); }

    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── ENVELOPE SCENE ── */
    #scene2 {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: var(--dark);
    }

    .scene2-hint {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 30px;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }

    #envelope {
      width: 340px;
      height: 230px;
      position: relative;
      cursor: pointer;
      perspective: 1200px;
      filter: drop-shadow(0 20px 60px rgba(201,168,76,0.25));
      transition: filter 0.3s ease;
    }

    #envelope:hover { filter: drop-shadow(0 25px 70px rgba(201,168,76,0.4)); }

    .env-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #2a2016, #1a1408);
      border-radius: 8px;
      border: 1px solid var(--gold-dim);
      z-index: 1;
    }

    .env-body::after {
      content: '✦';
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--gold-dim);
      font-size: 18px;
    }

    .env-left {
      position: absolute;
      width: 0;
      height: 0;
      border-top: 115px solid transparent;
      border-bottom: 115px solid transparent;
      border-left: 170px solid #1e1710;
      z-index: 2;
      border-radius: 2px;
    }

    .env-right {
      position: absolute;
      right: 0;
      width: 0;
      height: 0;
      border-top: 115px solid transparent;
      border-bottom: 115px solid transparent;
      border-right: 170px solid #221a0e;
      z-index: 2;
    }

    .env-bottom {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 170px solid transparent;
      border-right: 170px solid transparent;
      border-bottom: 130px solid #1c1509;
      z-index: 2;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip-path: polygon(0 0, 100% 0, 50% 52%);
      background: linear-gradient(160deg, #2e2210, #1a1408);
      border-top: 1px solid var(--gold-dim);
      transform-origin: top center;
      z-index: 5;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .open .flap { transform: rotateX(-180deg); }

    .letter {
      position: absolute;
      width: 82%;
      height: 78%;
      top: 11%;
      left: 9%;
      background: linear-gradient(160deg, #fdf6ee, #f5e8d5);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transform: translateY(55px) scale(0.92);
      opacity: 0;
      z-index: 4;
      transition: all 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
    }

    .letter::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 3px;
      pointer-events: none;
    }

    .letter h1 {
      font-family: 'Great Vibes', cursive;
      color: var(--gold-dim);
      font-size: 36px;
      line-height: 1;
    }

    .letter p {
      font-family: 'Cormorant Garamond', serif;
      color: #8a7050;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .showLetter .letter {
      transform: translateY(-88px) scale(1);
      opacity: 1;
    }

    /* ── MAIN PAGE ── */
    #page {
      display: none;
      min-height: 100vh;
      position: relative;
    }

    /* Noise texture overlay */
    #page::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── HERO SECTION ── */
    .hero {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 60px;
      padding: 80px 40px;
      position: relative;
      z-index: 1;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, #1e160e 0%, var(--dark) 100%);
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    /* Photo frame */
    .photo-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .photo-wrap::before {
      content: '';
      position: absolute;
      inset: -12px;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 18px;
    }

    .photo-wrap::after {
      content: '✦';
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--gold);
      font-size: 14px;
    }

    .photo {
      width: 300px;
      height: 380px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      background: #1a1208;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.2),
        0 30px 80px rgba(0,0,0,0.6);
    }

    /* Text side */
    .hero-text { text-align: center; max-width: 440px; }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.7;
      margin-bottom: 16px;
    }

    .names {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(64px, 12vw, 100px);
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 80px rgba(201,168,76,0.2);
    }

    .amp {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.55em;
      color: var(--rose-light);
      opacity: 0.8;
    }

    .event-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold-light);
      opacity: 0.6;
      margin-top: 10px;
      font-style: italic;
    }

    .divider-ornament {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin: 28px 0;
    }

    .divider-ornament span {
      flex: 1;
      height: 1px;
      max-width: 80px;
      background: linear-gradient(90deg, transparent, var(--gold-dim));
    }

    .divider-ornament span:last-child {
      background: linear-gradient(90deg, var(--gold-dim), transparent);
    }

    .divider-ornament i {
      color: var(--gold);
      font-size: 16px;
      font-style: normal;
    }

    /* Date badge */
    .date-badge {
      display: inline-block;
      border: 1px solid rgba(201,168,76,0.3);
      padding: 14px 32px;
      margin-bottom: 24px;
    }

    .date-badge .date-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
    }

    .date-badge .date-month {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-light);
      opacity: 0.6;
      margin-top: 4px;
    }

    /* Countdown */
    #countdown {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cd-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }

    .cd-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
    }

    .cd-label {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-top: 4px;
    }

    .cd-sep {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      color: var(--gold-dim);
      opacity: 0.4;
      align-self: flex-start;
      padding-top: 4px;
    }

    /* ── LOCATION SECTION ── */
    #location {
      padding: 100px 30px;
      text-align: center;
      position: relative;
      z-index: 1;
      background: linear-gradient(var(--dark), #0f0b07, var(--dark));
    }

    #location::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    .section-eyebrow {
      font-size: 10px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.6;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 300;
      color: var(--gold-light);
      margin-bottom: 10px;
    }

    .venue-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-style: italic;
      color: var(--gold-dim);
      letter-spacing: 1px;
      margin-bottom: 40px;
    }

    .map-wrap {
      width: 90%;
      max-width: 720px;
      margin: 0 auto 36px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 1px rgba(201,168,76,0.2), 0 30px 80px rgba(0,0,0,0.5);
    }

    .map-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(201,168,76,0.2);
      z-index: 2;
      pointer-events: none;
      border-radius: 4px;
    }

    .map-wrap iframe {
      width: 100%;
      height: 380px;
      border: 0;
      display: block;
      pointer-events: none;
      filter: grayscale(0.3) sepia(0.2);
    }

    /* MAP BUTTON */
    .mapBtn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 44px;
      border: 1px solid var(--gold);
      color: var(--gold) !important;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      z-index: 100;
      overflow: hidden;
      background: transparent;
    }

    .mapBtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-101%);
      transition: transform 0.4s ease;
      z-index: -1;
    }

    .mapBtn:hover { color: var(--dark) !important; }
    .mapBtn:hover::before { transform: translateX(0); }
    .mapBtn:active { transform: scale(0.98); }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      padding: 50px 20px;
      position: relative;
      z-index: 1;
    }

    .footer-names {
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
      color: var(--gold-dim);
    }

    .footer-sub {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--gold-dim);
      opacity: 0.4;
      margin-top: 8px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- PARTICLE LAYER -->
  <div id="particles"></div>

  <audio id="music" loop>
    <source src="01.Wayah.mp3" type="audio/mpeg">
  </audio>

  <!-- ── INTRO SCREEN ── -->
  <div id="overlay">
    <div class="ornament-top">✦ &nbsp; ✦ &nbsp; ✦</div>
    <div class="overlay-title">You're Invited</div>
    <div class="overlay-sub">A Celebration of Love</div>
    <div class="divider-line"></div>
    <button id="enterBtn">Open Invitation</button>
  </div>

  <!-- ── ENVELOPE SCENE ── -->
  <div id="scene2" style="display:none; position:fixed; inset:0; z-index:50; justify-content:center; align-items:center; flex-direction:column; background:var(--dark);">
    <div class="scene2-hint">Tap to open</div>
    <div id="envelope">
      <div class="env-body"></div>
      <div class="env-left"></div>
      <div class="env-right"></div>
      <div class="env-bottom"></div>
      <div class="letter">
        <h1>Nabil &amp; Nour</h1>
        <p>Engagement</p>
      </div>
      <div class="flap"></div>
    </div>
  </div>

  <!-- ── MAIN PAGE ── -->
  <div id="page">

    <!-- HERO -->
    <div class="hero">

      <div class="photo-wrap">
        <img
          src="nabil_photo.png"
          class="photo"
          alt="Nabil & Nour"
          onerror="this.src='https://placehold.co/300x380/1a1208/c9a84c?text=♡';">
      </div>

      <div class="hero-text">

        <div class="eyebrow">With joy we invite you to celebrate</div>

        <div class="names">
          Nabil<br>
          <span class="amp">&amp;</span><br>
          Nour
        </div>

        <div class="event-label">Engagement Celebration</div>

        <div class="divider-ornament">
          <span></span><i>✦</i><span></span>
        </div>

        <div class="date-badge">
          <div class="date-num">31</div>
          <div class="date-month">July &nbsp;·&nbsp; 2026</div>
        </div>

        <div id="countdown"></div>

      </div>
    </div>

    <!-- LOCATION -->
    <div id="location">

      <div class="section-eyebrow">Join us at</div>
      <div class="section-title">Our Venue</div>
      <div class="venue-name">قاعات رويال للأفراح</div>

      <div class="divider-ornament" style="margin-bottom:40px;">
        <span></span><i>✦</i><span></span>
      </div>

      <div class="map-wrap">
        <iframe
          src="https://maps.google.com/maps?q=30.1185186,31.3581914&z=16&output=embed"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>

      <a
        href="https://maps.app.goo.gl/tqFv5usSpEN3RZQ26"
        target="_blank"
        rel="noopener noreferrer"
        class="mapBtn">
        ✦ &nbsp; Open in Google Maps
      </a>

    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="divider-ornament" style="margin-bottom:24px; max-width:300px; margin-left:auto; margin-right:auto;">
        <span></span><i>✦</i><span></span>
      </div>
      <div class="footer-names">Nabil &amp; Nour</div>
      <div class="footer-sub">31 · 07 · 2026 &nbsp;·&nbsp; With Love</div>
    </div>

  </div>

  <script>
    /* ── PARTICLES ── */
    const particleContainer = document.getElementById("particles");
    const colors = ["#c9a84c","#e8d5a3","#c4607a","#f0b8c8","#ffffff"];

    function spawnParticle() {
      const p = document.createElement("div");
      p.className = "particle";
      const size = 2 + Math.random() * 4;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const duration = 8 + Math.random() * 10;
      const delay = Math.random() * 5;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        background:${color};
        opacity:0;
        animation-duration:${duration}s;
        animation-delay:${delay}s;
      `;
      particleContainer.appendChild(p);
      setTimeout(() => p.remove(), (duration + delay) * 1000);
    }

    for (let i = 0; i < 30; i++) spawnParticle();
    setInterval(spawnParticle, 600);

    /* ── ELEMENTS ── */
    const overlay  = document.getElementById("overlay");
    const scene2   = document.getElementById("scene2");
    const envelope = document.getElementById("envelope");
    const page     = document.getElementById("page");
    const music    = document.getElementById("music");
    let opened     = false;

    /* ── ENTER BUTTON ── */
    document.getElementById("enterBtn").onclick = () => {
      overlay.style.transition = "opacity 0.8s ease";
      overlay.style.opacity = "0";
      setTimeout(() => {
        overlay.style.display = "none";
        scene2.style.display  = "flex";
      }, 800);
    };

    /* ── ENVELOPE CLICK ── */
    envelope.onclick = () => {
      if (opened) return;
      opened = true;

      envelope.classList.add("open");

      setTimeout(() => {
        envelope.classList.add("showLetter");
      }, 600);

      setTimeout(() => {
        scene2.style.transition = "opacity 0.8s ease";
        scene2.style.opacity    = "0";
        setTimeout(() => {
          scene2.style.display = "none";
          page.style.display   = "block";
          document.body.classList.add("scrollable");
          startCountdown();
          music.play().catch(() => {});
          // Animate hero content in
          document.querySelectorAll('.hero > *').forEach((el, i) => {
            el.style.opacity = "0";
            el.style.transform = "translateY(30px)";
            el.style.transition = `opacity 0.8s ease ${i * 0.2}s, transform 0.8s ease ${i * 0.2}s`;
            requestAnimationFrame(() => {
              el.style.opacity = "1";
              el.style.transform = "translateY(0)";
            });
          });
        }, 800);
      }, 2800);
    };

    /* ── COUNTDOWN ── */
    function startCountdown() {
      const target = new Date("2026-07-31T18:00:00").getTime();
      const el = document.getElementById("countdown");

      function update() {
        const diff = target - Date.now();
        if (diff <= 0) {
          el.innerHTML = `<div class="cd-block"><div class="cd-num" style="font-size:28px">🎉 It's Time!</div></div>`;
          return;
        }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000)  / 60000);
        const s = Math.floor((diff % 60000)    / 1000);

        el.innerHTML = `
          <div class="cd-block"><div class="cd-num">${String(d).padStart(2,'0')}</div><div class="cd-label">Days</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-block"><div class="cd-num">${String(h).padStart(2,'0')}</div><div class="cd-label">Hours</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-block"><div class="cd-num">${String(m).padStart(2,'0')}</div><div class="cd-label">Mins</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-block"><div class="cd-num">${String(s).padStart(2,'0')}</div><div class="cd-label">Secs</div></div>
        `;
      }
      update();
      setInterval(update, 1000);
    }
  </script>

</body>
</html>
